[package]
name = "anthropophagy"
version = "0.1.0"
edition = "2021"

# =============================================================================
# ADR-030 (Módulo 4): Consumo SSOT do workspace
# =============================================================================
# Esta crate é membro do workspace `souls_mc`. Todas as deps comuns são
# herdadas via `{ workspace = true }` para evitar drift de versões entre
# `souls_mc` e `anthropophagy`, mantendo o lockfile unificado e o L3
# da CPU Host bem-aproveitado durante builds incrementais.
#
# Deps exclusivamente consumidas por este crate permanecem inline (com `=`),
# e deps com features customizadas sobre o workspace pin são referenciadas
# via `{ workspace = true }` e acrescidas de features locais quando aplicável.
# =============================================================================

[lib]
name = "anthropophagy"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "anthropophagy-daemon-watcher"
path = "src/bin/daemon_watcher.rs"

[[bin]]
name = "anthropophagy-deep-formatter"
path = "src/bin/deep_formatter.rs"

[[bin]]
name = "anthropophagy-guardian"
path = "src/bin/guardian.rs"

[[bin]]
name = "anthropophagy-harvester"
path = "src/bin/harvester.rs"

[[bin]]
name = "anthropophagy-outbox-sync"
path = "src/bin/outbox_sync.rs"

[dependencies]
# Dependência workspace-local: o crate anthropophagy consome APIs públicas
# de `souls_mc_lib` (telemetry, process_guard, finops, persist, model_manager,
# socratic_interrupt, etc.) que vivem no crate raiz. Path é `../..` porque
# este crate vive em `crates/anthropophagy/` e o manifest raiz está em
# `src-tauri/Cargo.toml`. Esta relação é estritamente unidirecional
# (anthropophagy -> souls_mc_lib), sem ciclos.
souls_mc_lib = { package = "souls_core", path = "../souls_core" }

# --- SSOT (workspace) ---
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
toml = { workspace = true }
dunce = { workspace = true }
rustc-hash = { workspace = true }
tinyrand = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
walkdir = { workspace = true }
dashmap = { workspace = true }
dotenvy = { workspace = true }
enable-ansi-support = { workspace = true }
ignore = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
sysinfo = { workspace = true }
rusqlite = { workspace = true }
sqlparser = { workspace = true }
tempfile = { workspace = true }
zstd = { workspace = true }
gix = { workspace = true }
oxc = { workspace = true }
quick-xml = { workspace = true }
astral-tl = { workspace = true }
bumpalo = { workspace = true }
memmap2 = { workspace = true }
jsonrepair = { workspace = true }
httparse = { workspace = true }
jsonwebtoken = { workspace = true }
tiktoken = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-yaml = { workspace = true }
windows-sys = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-row = { workspace = true }
arrow-cast = { workspace = true }
futures-util = { workspace = true }
similar = { workspace = true }
which = { workspace = true }
quote = { workspace = true }

# --- Crate-specific deps (pinned) ---
# TODAS as deps específicas deste crate foram auditadas (Marco 4.10.1/C5) e
# removidas por serem dead code (zero `use` no código fonte deste crate) ou
# por criarem conflitos de versão com requirements transitivos. O crate hoje
# consome exclusivamente o que vem do workspace SSOT (serde, tokio, reqwest,
# tracing, rusqlite, tinyrand, windows_*, etc.). Novas deps crate-specific
# devem ser adicionadas aqui SOMENTE após verificação de uso real no
# código fonte deste crate.

[target.'cfg(windows)'.dependencies]
# Windows ProjFS (vendored no workspace via `src-tauri/vendor/windows-projfs`).
# Apenas consumido por `harvester/projfs.rs` e `harvester/ramdisk.rs`
# (ambos `#[cfg(target_os = "windows")]`), portanto gateado pelo target.
windows-projfs = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
tempfile = { workspace = true }

[features]
# Feature-mirroring do crate raiz para satisfazer os `#[cfg(feature = ...)]`
# usados em `bin/arena.rs` e outros binários. Sem isso, rustc emite
# `unexpected_cfgs` warnings em cascata. As features em si são no-op aqui
# (a lógica de backend vive em `souls_mc`); declaramos apenas para que a
# arvore de cfg flags seja completa. C5/Marco 4.10.1.
default = []
llama_backend = []
mistral_backend = []
