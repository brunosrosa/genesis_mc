config: {}
binds:
  - port: 3009
    listeners:
      - protocol: HTTP
        routes:
          - backends:
              - mcp:
                  failureMode: failClosed
                  targets:
                    - name: mem
                      stdio:
                        cmd: 'Z:/souls_mc/src-tauri/target/debug/mcp_stdio_guard.exe'
                        args: ["--", "memory-mcp-rs.exe", "--db-path", "Z:/souls_mc/.soda_data/soda_state.db"]
                        env:
                          PATH: 'C:/Users/rosas/.cargo/bin;C:/Windows/System32'
                          LEAN_CTX_PROJECT_ROOT: 'Z:/souls_mc'
                          LEAN_CTX_DATA_DIR: 'Z:/souls_mc/.soda_data'
                          LEAN_CTX_CACHE_DIR: 'Z:/souls_mc/.soda_cache'
