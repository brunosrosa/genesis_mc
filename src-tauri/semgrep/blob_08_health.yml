rules:
  - id: soda.tech-debt.todo-fixme
    languages: [generic]
    severity: INFO
    message: "Marcador de divida tecnica encontrado"
    pattern-regex: '\b(TODO|FIXME|HACK|XXX)\b'

  - id: soda.rust.panic.unwrap.expect
    languages: [rust]
    severity: WARNING
    message: "panic/unwrap/expect aumentam fragilidade operacional"
    pattern-either:
      - pattern: panic!(...)
      - pattern: $VALUE.unwrap()
      - pattern: $VALUE.expect(...)

  - id: soda.javascript.console-debug
    languages: [javascript, typescript]
    severity: INFO
    message: "Console debug residual indica ruido ou debito tecnico"
    pattern-either:
      - pattern: console.log(...)
      - pattern: console.error(...)
      - pattern: console.warn(...)

  - id: soda.complexity.boolean-chain
    languages: [generic]
    severity: WARNING
    message: "Condicional com cadeia booleana densa sugere complexidade ciclomática elevada"
    pattern-regex: '(if|while)\s*[^\n]*(&&|\|\|)[^\n]*(&&|\|\|)'

  - id: soda.javascript.nested-ternary
    languages: [javascript, typescript]
    severity: WARNING
    message: "Ternario aninhado sugere alta complexidade de fluxo"
    pattern-regex: '\?.*\?.*:'
