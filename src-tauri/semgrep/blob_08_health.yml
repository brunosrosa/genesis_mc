rules:
  - id: soda.tech-debt.todo-fixme
    languages: [generic]
    severity: INFO
    message: "Marcador de divida tecnica encontrado"
    pattern-regex: '\b(TODO|FIXME|HACK|XXX)\b'

  - id: soda.rust.panic.unwrap.expect
    languages: [rust]
    severity: WARNING
    message: "panic/unwrap/expect aumentam fragilidade operacional"
    pattern-either:
      - pattern: panic!(...)
      - pattern: $VALUE.unwrap()
      - pattern: $VALUE.expect(...)

  - id: soda.javascript.console-debug
    languages: [javascript, typescript]
    severity: INFO
    message: "Console debug residual indica ruido ou debito tecnico"
    pattern-either:
      - pattern: console.log(...)
      - pattern: console.error(...)
      - pattern: console.warn(...)

  - id: soda.complexity.boolean-chain
    languages: [generic]
    severity: WARNING
    message: "Condicional com cadeia booleana densa sugere complexidade ciclomática elevada"
    pattern-regex: '(if|while)\s*[^\n]*(&&|\|\|)[^\n]*(&&|\|\|)'

  - id: soda.javascript.nested-ternary
    languages: [javascript, typescript]
    severity: WARNING
    message: "Ternario aninhado sugere alta complexidade de fluxo"
    pattern-regex: '\?.*\?.*:'

  - id: soda.javascript.debugger-residual
    languages: [javascript, typescript]
    severity: WARNING
    message: "Debugger residual indica entropia operacional"
    pattern: debugger

  - id: soda.python.debug-print
    languages: [python]
    severity: INFO
    message: "print residual sugere debug esquecido"
    pattern: print(...)

  - id: soda.go.debug-print
    languages: [go]
    severity: INFO
    message: "fmt.Print* residual sugere debug esquecido"
    pattern-either:
      - pattern: fmt.Print(...)
      - pattern: fmt.Println(...)
      - pattern: fmt.Printf(...)

  - id: soda.elixir.debug-io-inspect
    languages: [elixir]
    severity: INFO
    message: "IO.inspect residual sugere debug esquecido"
    pattern: IO.inspect(...)
