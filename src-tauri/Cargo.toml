[package]
name = "souls_mc"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "souls_mc_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# Resolve tudo via workspace SSOT (= pinning).
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
toml = { workspace = true }
dunce = { workspace = true }
rustc-hash = { workspace = true }
tinyrand = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
walkdir = { workspace = true }
dashmap = { workspace = true }
dotenvy = { workspace = true }
enable-ansi-support = { workspace = true }
ignore = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
sysinfo = { workspace = true }
rusqlite = { workspace = true }
sqlparser = { workspace = true }
tempfile = { workspace = true }
zstd = { workspace = true }
gix = { workspace = true }
oxc = { workspace = true }
quick-xml = { workspace = true }
astral-tl = { workspace = true }
bumpalo = { workspace = true }
memmap2 = { workspace = true }
pulldown-cmark = { workspace = true }
jsonrepair = { workspace = true }
httparse = { workspace = true }
jsonwebtoken = { workspace = true }
aho-corasick = { workspace = true }
tiktoken = { workspace = true }
tokenizers = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-yaml = { workspace = true }
windows-sys = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-row = { workspace = true }
arrow-cast = { workspace = true }
futures-util = { workspace = true }
similar = { workspace = true }
which = { workspace = true }
quote = { workspace = true }
nvml-wrapper = { workspace = true }
# lancedb não está no workspace (mantido inline com version pinado).
lancedb = { version = "0.30.0", default-features = false }
# tauri (optional) e plurais específicos do crate principal.
tauri = { workspace = true, optional = true }
tauri-plugin-opener = { workspace = true, optional = true }
# ML inference backends (gated por features; workspace pin impõe versão rígida).
# SOULS MC Marco IV: ik-llama-cpp-2 (vendored, canibalizado com shims).
ik-llama-cpp-2 = { workspace = true, optional = true }
ik-llama-cpp-sys = { workspace = true, optional = true }
mistralrs = { workspace = true, optional = true }
llguidance = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-projfs = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
tauri-app = ["dep:tauri", "dep:tauri-plugin-opener", "tauri/custom-protocol"]
llama_backend = ["dep:ik-llama-cpp-2", "ik-llama-cpp-2/cuda", "dep:llguidance", "lora_adapter"]
mistral_backend = ["dep:mistralrs"]
grammar_backend = ["dep:llguidance"]
# Marco 4.10.1 — ETAPA 5: gateway_ccr é um marker feature que gateia o
# binário `agentgateway_tcp_proxy` (o único que depende do compressor
# CCR + L7 Shield). A lib (souls_mc_lib) mantém a CCR API sempre
# disponível, mas o proxy só compila com a flag ON.
gateway_ccr = []
# SOULS V6 MARCO IV: lora_adapter é uma marker feature que gateia o hot-swap
# de adaptadores LoRA via FFI ik_llama.cpp. NÃO depende de `llama_backend`
# (que força CUDA) porque a FFI do ik_llama é declarada e resolvida em runtime
# pelo módulo — nenhum símbolo é referenciado em link-time. Permite validar
# o silício em esteiras sem toolchain CUDA. Em produção, basta habilitar
# `llama_backend` que `lora_adapter` é transitivamente incluído.
lora_adapter = []
# Em produção, habilite `ik_llama_ffi` junto com `lora_adapter` para injetar
# a chamada FFI real. Requer `ik_llama.lib` no link path.
ik_llama_ffi = []

[[bin]]
name = "souls_mc"
path = "src/main.rs"
required-features = ["tauri-app"]

[[bin]]
name = "souls_mcp_server"
path = "src/bin/souls_mcp_server/main.rs"

[[bin]]
name = "souls_vanguard_worker"
path = "src/bin/souls_vanguard_worker.rs"
required-features = ["llama_backend"]

# Marco 4.10.1 — ETAPA 5: binários CCR-gated. O proxy L7 + o stdio guard
# só compilam com a feature `gateway_ccr` (não inflando binários de
# produção que não precisam do compressor).
[[bin]]
name = "agentgateway_tcp_proxy"
path = "src/bin/agentgateway_tcp_proxy.rs"
required-features = ["gateway_ccr"]

[[bin]]
name = "mcp_stdio_guard"
path = "src/bin/mcp_stdio_guard.rs"
required-features = ["gateway_ccr"]
