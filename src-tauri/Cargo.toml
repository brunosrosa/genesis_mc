[package]
name = "souls_mc"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[workspace]
members = ["crates/anthropophagy"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# =============================================================================
# ADR-030 (Módulo 4): Workspace Dependency Pinning Rígido
# =============================================================================
# Todas as deps comuns são pinadas com '=' aqui (SSOT do workspace), garantindo:
# 1. Árvore de resolução unificada entre `souls_mc` e `crates/anthropophagy`.
# 2. Redução de duplicação transitória no L3 da CPU Host (cache de artefatos).
# 3. Build incremental mais rápido (cargo reusa o mesmo rmeta por crate).
# 4. Defesa em profundidade contra drift silencioso de versões.
# Membros do workspace DEVEM referenciar via `{ workspace = true }` ao invés
# de duplicar specs. Deps platform-specific/optional ficam inline no manifest
# do crate que as consome.
# =============================================================================
[workspace.dependencies]
# --- Core / Sync primitives ---
serde = { version = "=1.0.228", features = ["derive"] }
# ADR-030 + Marco I · v6.1: `preserve_order` garante que a ordem das chaves no
# JSONC canônico (`.souls/config/souls-gateway.jsonc`) seja preservada no parse
# — necessário para garantir que Z1 (System Prompt) e Z2 (Tool Schemas) sejam
# serializados na mesma ordem byte-a-byte em chamadas consecutivas, honrando
# o contrato de Prefix Caching dos provedores upstream.
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
regex = "=1.12.4"
url = "=2.5.8"
toml = "=1.1.4"
dunce = "=1.0.5"
rustc-hash = "=2.1.3"
tinyrand = "=0.5.0"
uuid = { version = "=1.23.4", features = ["v4"] }
sha2 = "=0.10.9"
walkdir = "=2.5.0"
dashmap = "6.1.0"
dotenvy = "=0.15.7"
enable-ansi-support = "=0.2.1"
ignore = "=0.4.25"

# --- Async runtime / networking ---
tokio = { version = "=1.51.1", features = ["full"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "blocking", "rustls-tls-webpki-roots", "charset", "http2"] }

# --- Observability / logging ---
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
thiserror = { version = "=2.0.19", default-features = false }
sysinfo = "=0.30.13"

# --- Persistence / SQL / Vectors ---
rusqlite = { version = "=0.39.0", features = ["bundled"] }
sqlparser = "=0.62.0"
tempfile = "=3.27.0"
zstd = "=0.13.3"

# --- Git / VCS ---
gix = { version = "=0.84.0", features = ["blocking-network-client", "worktree-mutation"] }

# --- Parsing / Encoding ---
oxc = { version = "=0.120.0", features = ["ast_visit"] }
quick-xml = "=0.39.4"
astral-tl = "=0.7.11"
bumpalo = { version = "=3.20.3", features = ["collections"] }
memmap2 = "=0.9.11"
pulldown-cmark = "=0.13.4"
jsonrepair = "=0.1.0"
httparse = "=1.10.1"
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["use_pem", "rust_crypto"] }
# --- Marco I · v6.1: Aho-Corasick para PII redaction determinística linear ---
# Exceção ADR-030 (canibalização > dependência) justificada por requisito
# explícito do Marco I: algoritmo deterministicamente linear na CPU para
# mapear PII (caminhos, chaves, credenciais) em tokens opacos reversíveis.
# `aho-corasick = 1.1` é a referência canônica em Rust (BurntSushi).
aho-corasick = "=1.1.4"

# --- Tokenizers / NLP ---
tiktoken = "=3.5.1"
tokenizers = "=0.21.4"

# --- WASM Sandbox ---
wasmtime = { version = "=29.0.0", features = ["wat"] }
wasmtime-wasi = "=29.0.0"

# --- Tree-sitter ---
tree-sitter = "=0.26.10"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-yaml = "=0.7.2"

# --- Windows API (unified v0.61.2 - ADR-030) ---
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
] }

# --- Arrow (vector / LanceDB stack) ---
arrow-array = "=58.4.0"
arrow-schema = "=58.4.0"
arrow-row = "=58.4.0"
arrow-cast = "=58.4.0"

# --- Misc utilities ---
futures-util = "=0.3.31"
similar = "=2.7.0"
which = "=6.0.3"
quote = "=1.0.46"
nvml-wrapper = "0.10.0"

# --- Tauri (only consumed by `souls_mc`; flag `optional` é adicionada no consumidor). ---
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-opener = { version = "=2.5.4" }
tauri-build = { version = "=2.6.3" }
windows-projfs = "=0.1.8"

# --- ML Inference (pinned; flag `optional` é adicionada nos consumidores). ---
# NOTA (Battle 3 - Sprint Alfa): O transplante para `ik-llama-cpp-2` v0.1.7
# (fork ikawrakow) está BLOCKED AMBIENTALMENTE: a versão v0.1.7 é Linux-only
# (linha 13 do build.rs: "Linux (CPU + CUDA) focused for v1"). O `ext_ok` é
# hardcoded para `.a`/`.so` e não suporta `.lib` do Windows MSVC. O workaround
# testado (`ik-llama-cpp-sys` com `git init` para o `git rev-parse` do CMake)
# chegou até a produção dos `.lib` em `out/lib/`, mas a fase de link falha em
# `link_built` com "could not find libllama.* under out/build".
# Pelo ADR-030 (Canibalização Cirúrgica), mantemos `llama-cpp-2` upstream
# até que o fork ikawrakow publique uma versão com suporte Windows MSVC
# (provavelmente v0.2.0+). O TurboQuant (K=F16, V=Q4_K) já está aplicado
# no `llama_engine.rs` (Battle 3.2) — é drop-in via `KvCacheType` enum,
# idêntico entre ik e upstream.
llama-cpp-2 = { version = "0.1", features = ["cuda"] }
mistralrs = "0.8"
llguidance = "1.7"

# --- Test-only ---
mockito = "=1.7.2"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "souls_mc_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# Resolve tudo via workspace SSOT (= pinning).
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
toml = { workspace = true }
dunce = { workspace = true }
rustc-hash = { workspace = true }
tinyrand = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
walkdir = { workspace = true }
dashmap = { workspace = true }
dotenvy = { workspace = true }
enable-ansi-support = { workspace = true }
ignore = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
sysinfo = { workspace = true }
rusqlite = { workspace = true }
sqlparser = { workspace = true }
tempfile = { workspace = true }
zstd = { workspace = true }
gix = { workspace = true }
oxc = { workspace = true }
quick-xml = { workspace = true }
astral-tl = { workspace = true }
bumpalo = { workspace = true }
memmap2 = { workspace = true }
pulldown-cmark = { workspace = true }
jsonrepair = { workspace = true }
httparse = { workspace = true }
jsonwebtoken = { workspace = true }
aho-corasick = { workspace = true }
tiktoken = { workspace = true }
tokenizers = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-yaml = { workspace = true }
windows-sys = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-row = { workspace = true }
arrow-cast = { workspace = true }
futures-util = { workspace = true }
similar = { workspace = true }
which = { workspace = true }
quote = { workspace = true }
nvml-wrapper = { workspace = true }
# lancedb não está no workspace (mantido inline com version pinado).
lancedb = { version = "0.30.0", default-features = false }
# tauri (optional) e plurais específicos do crate principal.
tauri = { workspace = true, optional = true }
tauri-plugin-opener = { workspace = true, optional = true }
# ML inference backends (gated por features; workspace pin impõe versão rígida).
llama-cpp-2 = { workspace = true, optional = true }
mistralrs = { workspace = true, optional = true }
llguidance = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-projfs = { workspace = true }

# [patch.crates-io] removido (C5/Marco 4.10.1): os paths `vendor/crc32fast`,
# `vendor/llama-cpp-2` e `vendor/llama-cpp-sys-2` não existem mais na arvore
# (deps do vendor foram canibalizadas/canonizadas). O resolver do cargo agora
# busca `crc32fast` e o stack `llama-cpp-*` diretamente do crates.io, sob
# os pins `=` do workspace.

[dev-dependencies]
mockito = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
tauri-app = ["dep:tauri", "dep:tauri-plugin-opener"]
llama_backend = ["dep:llama-cpp-2", "llama-cpp-2/cuda", "dep:llguidance", "lora_adapter"]
mistral_backend = ["dep:mistralrs"]
grammar_backend = ["dep:llguidance"]
# Marco 4.10.1 — ETAPA 5: gateway_ccr é um marker feature que gateia o
# binário `agentgateway_tcp_proxy` (o único que depende do compressor
# CCR + L7 Shield). A lib (souls_mc_lib) mantém a CCR API sempre
# disponível, mas o proxy só compila com a flag ON.
gateway_ccr = []
# SOULS V6 MARCO IV: lora_adapter é uma marker feature que gateia o hot-swap
# de adaptadores LoRA via FFI ik_llama.cpp. NÃO depende de `llama_backend`
# (que força CUDA) porque a FFI do ik_llama é declarada e resolvida em runtime
# pelo módulo — nenhum símbolo é referenciado em link-time. Permite validar
# o silício em esteiras sem toolchain CUDA. Em produção, basta habilitar
# `llama_backend` que `lora_adapter` é transitivamente incluído.
lora_adapter = []
# Em produção, habilite `ik_llama_ffi` junto com `lora_adapter` para injetar
# a chamada FFI real. Requer `ik_llama.lib` no link path.
ik_llama_ffi = []

[[bin]]
name = "souls_mc"
path = "src/main.rs"
required-features = ["tauri-app"]

[[bin]]
name = "souls_mcp_server"
path = "src/bin/souls_mcp_server/main.rs"

[[bin]]
name = "souls_vanguard_worker"
path = "src/bin/souls_vanguard_worker.rs"
required-features = ["llama_backend"]

# Marco 4.10.1 — ETAPA 5: binários CCR-gated. O proxy L7 + o stdio guard
# só compilam com a feature `gateway_ccr` (não inflando binários de
# produção que não precisam do compressor).
[[bin]]
name = "agentgateway_tcp_proxy"
path = "src/bin/agentgateway_tcp_proxy.rs"
required-features = ["gateway_ccr"]

[[bin]]
name = "mcp_stdio_guard"
path = "src/bin/mcp_stdio_guard.rs"
required-features = ["gateway_ccr"]

# ---------- PROFILES (fix/cargo-finops-v1) ----------
# Dev/test já estão definidos abaixo. Aqui entramos com [profile.release]:
# lto=thin (cross-module sem dobar tempo de link), panic=abort (binário menor,
# sem unwind), codegen-units=1 (LTO eficaz), strip=symbols (release sem PDB).
# Opt-level=3 porque temos inferência numérica (mistralrs/llama) que se beneficia
# agressivamente de AVX2 — não trocamos runtime por tamanho.
# ATENÇÃO: settings granulares de package.* vivem em .cargo/config.toml (workspace-level).
[profile.dev]
incremental = false

[profile.test]
incremental = false

[profile.release]
lto = "thin"
panic = "abort"
codegen-units = 1
strip = "symbols"
opt-level = 3
incremental = false
