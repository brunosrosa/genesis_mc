[package]
name = "mcp-google-workspace"
version = "0.1.0"
edition = "2021"

[dependencies]
async-mcp = { version = "=0.1.0" }
tokio = { version = "=1.43.0", features = ["full"] }
serde = { version = "=1.0.218", features = ["derive"] }
serde_json = "=1.0.139"
anyhow = "=1.0.96"
async-trait = "=0.1.86"
tracing-subscriber = { version = "=0.3.19", features = [
  "env-filter",
  "tracing-log",
] }
tracing = "=0.1.41"
url = "=2.5.4"
google-sheets4 = { version = "=6.0.0", features = ["default"] }
google-drive3 = "=6.0.0"
clap = { version = "=4.5.30", features = ["derive", "env"] }
reqwest = { version = "=0.12.12", default-features = false, features = [
  "json",
  "stream",
] }
chrono = { version = "=0.4.39", features = ["serde"] }
thiserror = "=2.0.11"
rand = "=0.8.5"
base64 = "=0.21.7"
urlencoding = "=2.1.3"

[dev-dependencies]
dotenv = "=0.15.0"

[[bin]]
name = "mcp-google"
path = "src/main.rs"
