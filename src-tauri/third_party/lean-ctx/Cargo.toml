[package]
edition = "2021"
name = "lean-ctx"
version = "3.3.2"
build = "build.rs"
exclude = [
    "examples/",
    "tests/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Context Runtime for AI Agents with CCP. 46 MCP tools, 10 read modes, 90+ compression patterns, cross-session memory (CCP), persistent AI knowledge with temporal facts + contradiction detection, multi-agent context sharing + diaries, LITM-aware positioning, AAAK compact format, adaptive compression with Thompson Sampling bandits. Supports 24 AI tools. Reduces LLM token consumption by up to 99%."
homepage = "https://leanctx.com"
readme = "README.md"
keywords = [
    "mcp",
    "llm",
    "tokens",
    "compression",
    "ai",
]
categories = [
    "command-line-utilities",
    "development-tools",
]
license = "Apache-2.0"
repository = "https://github.com/yvgude/lean-ctx"

[features]
# SOULS-CANIBALIZED: default = [] remove tree-sitter (18 linguagens), embeddings (rten)
# e http-server (axum). O SOULS injeta apenas a alma matemática pura.
# Features opcionais para canibalização futura:
#   tree-sitter-rust-only -> apenas tree-sitter-rust (1 linguagem C-FFI)
#   tree-sitter-multilang -> as 18 linguagens restantes
#   neural                -> rten embeddings
#   http-server           -> servidor MCP-Streamable-HTTP (rmcp/axum)
default = []
embeddings = [
    "dep:rten",
    "dep:rten-tensor",
]
http-server = [
    "dep:rmcp",
    "dep:reqwest",
    "dep:jsonwebtoken",
]
neural = [
    "dep:rten",
    "dep:rten-tensor",
]
# SOULS-CANIBALIZED: feature que reativa rusqlite (property_graph)
# NÃO ATIVAR sem antes alinhar rusqlite com souls_mc.
rusqlite-storage = [
    "dep:rusqlite",
]
tui = [
    "dep:crossterm",
    "dep:ratatui",
]
tree-sitter-rust-only = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
]
tree-sitter-multilang = [
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-c",
