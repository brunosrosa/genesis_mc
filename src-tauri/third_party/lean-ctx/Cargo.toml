[package]
edition = "2021"
name = "lean-ctx"
version = "3.3.2"
build = "build.rs"
exclude = [
    "examples/",
    "tests/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Context Runtime for AI Agents with CCP. 46 MCP tools, 10 read modes, 90+ compression patterns, cross-session memory (CCP), persistent AI knowledge with temporal facts + contradiction detection, multi-agent context sharing + diaries, LITM-aware positioning, AAAK compact format, adaptive compression with Thompson Sampling bandits. Supports 24 AI tools. Reduces LLM token consumption by up to 99%."
homepage = "https://leanctx.com"
readme = "README.md"
keywords = [
    "mcp",
    "llm",
    "tokens",
    "compression",
    "ai",
]
categories = [
    "command-line-utilities",
    "development-tools",
]
license = "Apache-2.0"
repository = "https://github.com/yvgude/lean-ctx"

[features]
cloud-server = [
    "http-server",
    "dep:deadpool-postgres",
    "dep:tokio-postgres",
    "dep:lettre",
    "dep:jsonwebtoken",
    "dep:uuid",
    "dep:hex",
    "dep:sha2",
    "dep:rand",
]
default = [
    "tree-sitter",
    "embeddings",
    "http-server",
]
embeddings = [
    "dep:rten",
    "dep:rten-tensor",
]
http-server = [
    "dep:axum",
    "dep:tower-http",
    "dep:reqwest",
]
neural = [
    "dep:rten",
    "dep:rten-tensor",
]
tree-sitter = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-kotlin-ng",
    "dep:tree-sitter-swift",
    "dep:tree-sitter-php",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-dart",
    "dep:tree-sitter-scala",
    "dep:tree-sitter-elixir",
    "dep:tree-sitter-zig",
]

[lib]
name = "lean_ctx"
path = "src/lib.rs"

[[bin]]
name = "gen_mcp_manifest"
path = "src/bin/gen_mcp_manifest.rs"

[[bin]]
name = "gen_tdd_schema"
path = "src/bin/gen_tdd_schema.rs"

[[bin]]
name = "lean-ctx"
path = "src/main.rs"

[[bin]]
name = "lean-ctx-cloud-api"
path = "src/cloud_server_main.rs"
required-features = ["cloud-server"]

[[bin]]
name = "seed_observatory"
path = "src/bin/seed_observatory.rs"

