# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config: {}
binds:
  - port: 3001
    listeners:
      - protocol: HTTP
        routes:
          - policies:
              cors:
                allowOrigins: ['*']
                allowHeaders: ['*']
                exposeHeaders: ['Mcp-Session-Id']
              mcpAuthorization:
                # VÁLVULA INTELIGENTE CEL (FIREWALL L7) (v1.3 Zero-Brand & SODA Data Governance)
                # Permite a passagem do namespace souls_ctx_ e protege o handshake de inicialização
                rules:
                  - >
                    !has(mcp.tool)
                    || mcp.tool.name.startsWith("souls_ctx_")
                    || mcp.tool.name.startsWith("soda_")
                    || mcp.tool.name.startsWith("core_")
                    || mcp.tool.name.startsWith("mem_")
                    || !mcp.tool.name.matches("^(.*delete.*|clear_values)$")
            backends:
              # ==========================================
              # NÚCLEO COGNITIVO SODA (FAIL CLOSED)
              # ==========================================
              - mcp:
                  failureMode: failClosed
                  targets:
                    - name: souls
                      stdio:
                        cmd: 'Z:/souls_mc/src-tauri/target/debug/lean-ctx.exe'
                        args: []
                        env:
                          LEAN_CTX_PROJECT_ROOT: 'Z:/souls_mc'
                          LEAN_CTX_DATA_DIR: 'Z:/souls_mc/.soda_data'
                          LEAN_CTX_CACHE_DIR: 'Z:/souls_mc/.soda_cache'
                          PATH: 'C:/Users/rosas/.cargo/bin;C:/Windows/System32'
                    - name: core
                      stdio:
                        cmd: 'sequential-thinking-server.exe'
                        args: []
                        env:
                          PATH: 'C:/Users/rosas/.cargo/bin;C:/Windows/System32'
                          RUST_LOG: 'off'
                    - name: mem
                      stdio:
                        cmd: 'memory-mcp-rs.exe'
                        args: ['--db-path', 'Z:/souls_mc/.soda_data/soda_state.db']
                        env:
                          PATH: 'C:/Users/rosas/.cargo/bin;C:/Windows/System32'
                    - name: soda
                      stdio:
                        cmd: 'Z:/souls_mc/src-tauri/target/debug/soda_mcp_server.exe'
                        args: []
                        env:
                          PATH: 'C:/Users/rosas/.cargo/bin;C:/Windows/System32'

