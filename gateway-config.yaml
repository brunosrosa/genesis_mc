# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config: {}
binds:
  - port: 3001
    listeners:
      - protocol: HTTP
        routes:
          - policies:
              cors:
                allowOrigins: ['*']
                allowHeaders: ['*']
                exposeHeaders: ['Mcp-Session-Id']
            backends:
              - mcp:
                  targets:
                    - name: souls_mcp
                      stdio:
                        cmd: 'Z:/souls_mc/src-tauri/target/debug/souls_mcp_server.exe'
