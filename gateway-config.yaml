# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config: {}
binds:
  - port: 3001
    listeners:
      - protocol: HTTP
        routes:
          - policies:
              cors:
                allowOrigins: ['*']
                allowHeaders: ['*']
                exposeHeaders: ['Mcp-Session-Id']
              requestHeaderModifier:
                set:
                  DOCFORK_API_KEY: '${DOCFORK_API_KEY}'
              mcpAuthorization:
                # VÁLVULA INTELIGENTE CEL (FIREWALL L7) (v1.2 07/05/2026)
                # Usando short-circuit com !has() para proteger o handshake de inicialização
                rules:
                  - >
                    !has(mcp.tool) 
                    || mcp.tool.name.matches("^(index_folder|index_repo|get_file_tree|get_file_outline|get_symbol_source|search_symbols|get_file_content)$")
                    || mcp.tool.name.matches("^(get_current_time|read_query|list_tables|describe_table|sequentialthinking)$")
                    || mcp.tool.name.matches("^(search_repositories|get_file_contents|search_issues|get_issue|get_pull_request|list_pull_requests|projects_list|projects_get|projects_write|issue_write)$")
                    || mcp.tool.name.matches("^(notebook_query|notebook_list|notebook_get|notebook_create|notebook_delete|source_get_content|source_add|source_delete|add_source|delete_source)$")
                    || mcp.tool.name.matches("^(web_search|duckduckgo_search|fetch_content)$")
                    || mcp.tool.name.matches("^(webcrawl_search|webcrawl_scrape|webcrawl_map|webcrawl_crawl)$")
                    || mcp.tool.name.matches("^(read_values|write_values|create_spreadsheet|clear_values|get_sheet_info)$")
                    || mcp.tool.name.matches("^(search_docs|get_docs_tree|docfork_search_docs|fetch_doc)$")
                    || mcp.tool.name.matches("^(memory_.*|sqlite_.*|lean_.*|sqz_.*|toon_compress)$")
            backends:
              # ==========================================
              # NÚCLEO COGNITIVO SODA (FAIL CLOSED)
              # ==========================================
              - mcp:
                  failureMode: failClosed
                  targets:
                    - name: lean-ctx
                      stdio:
                        cmd: 'lean-ctx.exe'
                        args: []
                        env:
                          PATH: 'C:/Users/rosas/.cargo/bin;C:/Windows/System32'
                    - name: sequential_thinking
                      stdio:
                        cmd: 'sequential-thinking-server.exe'
                        args: []
                        env:
                          PATH: 'C:/Users/rosas/.cargo/bin;C:/Windows/System32'
                          RUST_LOG: 'off'
                    - name: memory-mcp-rs
                      stdio:
                        cmd: 'memory-mcp-rs.exe'
                        args: ['--db-path', 'Z:/genesis_mc/.soda_data/soda_state.db']
                        env:
                          PATH: 'C:/Users/rosas/.cargo/bin;C:/Windows/System32'
              # ==========================================
              # ENXAME DE FERRAMENTAS (FAIL OPEN)
              # Se uma tool falhar, isole e continue.
              # ==========================================
              - mcp:
                  failureMode: failOpen
                  targets:
                    - name: jcodemunch
                      stdio:
                        cmd: 'Z:/genesis_mc/src-tauri/target/debug/mcp_stdio_guard.exe'
                        args:
                          [
                            '--timeout-ms',
                            '30000',
                            '--',
                            'uvx.exe',
                            'jcodemunch-mcp',
                          ]
                        env:
                          UV_NO_PROGRESS: '1'
                          UV_QUIET: '1'
                    - name: time_server
                      stdio:
                        cmd: 'Z:/genesis_mc/src-tauri/target/debug/mcp_stdio_guard.exe'
                        args: ['--timeout-ms', '30000', '--', 'mcp-server-time.exe']
                        env:
                          PATH: 'C:/Users/rosas/.cargo/bin;C:/Windows/System32'
                    - name: duckduckgo_search
                      stdio:
                        cmd: 'Z:/genesis_mc/src-tauri/target/debug/mcp_stdio_guard.exe'
                        args:
                          [
                            '--timeout-ms',
                            '30000',
                            '--',
                            'uvx.exe',
                            'duckduckgo-mcp-server',
                          ]
                        env:
                          UV_NO_PROGRESS: '1'
                          UV_QUIET: '1'
                    - name: github_mcp
                      stdio:
                        cmd: 'Z:/genesis_mc/src-tauri/target/debug/mcp_stdio_guard.exe'
                        args:
                          [
                            '--timeout-ms',
                            '30000',
                            '--',
                            'npx.cmd',
                            '-y',
                            '@modelcontextprotocol/server-github',
                          ]
                        env:
                          GITHUB_PERSONAL_ACCESS_TOKEN: '${GITHUB_PAT}'
                    - name: notebooklm
                      stdio:
                        cmd: 'Z:/genesis_mc/src-tauri/target/debug/mcp_stdio_guard.exe'
                        args:
                          [
                            '--timeout-ms',
                            '30000',
                            '--',
                            'uvx.exe',
                            '--from',
                            'notebooklm-mcp-cli',
                            'notebooklm-mcp',
                          ]
                        env:
                          UV_NO_PROGRESS: '1'
                          UV_QUIET: '1'
                    - name: sqlite
                      stdio:
                        cmd: 'Z:/genesis_mc/src-tauri/target/debug/mcp_stdio_guard.exe'
                        args:
                          [
                            '--timeout-ms',
                            '30000',
                            '--',
                            'uvx.exe',
                            'mcp-server-sqlite',
                            '--db-path',
                            'Z:/genesis_mc/.soda_data/soda_state.db',
                          ]
                        env:
                          UV_NO_PROGRESS: '1'
                          UV_QUIET: '1'
                    - name: docs_scraper
                      stdio:
                        cmd: 'Z:/genesis_mc/src-tauri/target/debug/mcp_stdio_guard.exe'
                        args: ['--timeout-ms', '30000', '--', 'npx.cmd', '-y', 'mcp-docs-scraper']
                    - name: webcrawl-mcp
                      stdio:
                        cmd: 'Z:/genesis_mc/src-tauri/target/debug/mcp_stdio_guard.exe'
                        args:
                          [
                            '--timeout-ms',
                            '30000',
                            '--',
                            'uvx.exe',
                            'webcrawl-mcp',
                          ]
                        env:
                          UV_NO_PROGRESS: '1'
                          UV_QUIET: '1'
                    - name: mcp-google-workspace
                      stdio:
                        cmd: 'Z:/genesis_mc/src-tauri/target/debug/mcp_stdio_guard.exe'
                        args:
                          [
                            '--timeout-ms',
                            '180000',
                            '--',
                            '${MCP_GOOGLE_WORKSPACE_BIN}',
                            'sheets',
                          ]
                        env:
                          PATH: 'C:/Users/rosas/.cargo/bin;C:/Windows/System32'
                    - name: docfork
                      mcp:
                        host: 'https://mcp.docfork.com/mcp'
