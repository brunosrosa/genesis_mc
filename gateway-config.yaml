# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config: {}
binds:
  - port: 3001
    listeners:
      - protocol: HTTP
        routes:
          - policies:
              cors:
                allowOrigins: ['*']
                allowHeaders: ['*']
                exposeHeaders: ['Mcp-Session-Id']
              mcpAuthorization:
                # VÁLVULA INTELIGENTE CEL (FIREWALL L7) (v1.2 07/05/2026)
                # Usando short-circuit com !has() para proteger o handshake de inicialização
                rules:
                  - >
                    !has(mcp.tool)
                    || !mcp.tool.name.matches("^(.*_edit|.*_task|.*_workflow|.*_share|.*_handoff|.*_overview|.*_prefetch|.*_preload|.*_fill|.*_routes|.*_response|.*_dedup|.*_agent|.*_knowledge|.*_benchmark|.*_cache|.*_cost|.*_analyze|.*_discover|.*delete.*|clear_values)$")
            backends:
              # ==========================================
              # NÚCLEO COGNITIVO SODA (FAIL CLOSED)
              # ==========================================
              - mcp:
                  failureMode: failClosed
                  targets:
                    - name: lean
                      stdio:
                        cmd: 'src-tauri/target/debug/mcp_stdio_guard.exe'
                        args: ['--timeout-ms', '30000', '--', 'src-tauri/target/debug/lean-ctx.exe']
                    - name: core
                      stdio:
                        cmd: 'sequential-thinking-server.exe'
                        args: []
                        env:
                          PATH: 'C:/Users/rosas/.cargo/bin;C:/Windows/System32'
                          RUST_LOG: 'off'
                    - name: mem
                      stdio:
                        cmd: 'memory-mcp-rs.exe'
                        args: ['--db-path', 'Z:/souls_mc/.soda_data/soda_state.db']
                        env:
                          PATH: 'C:/Users/rosas/.cargo/bin;C:/Windows/System32'
                    - name: soda
                      mcp:
                        host: 'http://127.0.0.1:3002/mcp'
