[env]
LLAMA_CUDA = "1"
CMAKE_CUDA_ARCHITECTURES = "75"
CMAKE_GENERATOR = "Ninja"
# SOULS MC Marco IV: align ik_llama.cpp CRT with the rest of the Rust project
# (which is /MD, dynamic MSVCP140.dll). Without this, link fails with
# LNK1319: 321 mismatches + LNK4098 defaultlib 'LIBCMT' conflict.
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreadedDebugDLL"
# Marco IV hotfix: `esaxx-rs` (suffix-array tokenizador dentro de
# ik-llama-cpp-sys) compila o `esaxx.c` via `cc-rs`. cc-rs no Windows MSVC
# default é /MT (estático), mas o restante do workspace usa /MD. Sem estes
# flags, o `esaxx.o` vaza com `MT_StaticRelease` e conflita no link com
# `MD_DynamicRelease` (326 mismatches). Forçamos /MD aqui.
CFLAGS = "/MD"
CXXFLAGS = "/MD"
# Injeção canônica global: blinda sccache contra bypass silencioso no disco C:
SCCACHE_DIR = "Z:\\.sccache"
SCCACHE_CACHE_SIZE = "8G"

[target.x86_64-pc-windows-msvc]
# REMOVIDO "rust-lld.exe" como linker global para evitar que o LLD pode seções
# críticas de registro de kernels CUDA do llama-cpp-sys-2 (__cudaRegisterFatBinary).
# O sistema usará o link.exe nativo do MSVC, que é 100% homologado pela NVIDIA.
# ADR-039 / Battle 2: ggml-cuda e ggml-base compartilham símbolos no link
# (ex.: ggml_cuda_* vs ggml_* já exportados). /FORCE:MULTIPLE permite a
# coexistência sem LNK4006/LNK1169. Custo: binário ligeiramente maior.
rustflags = [
  "-C", "link-arg=/Brepro",
  "-C", "link-arg=/FORCE:MULTIPLE",
]

[build]
rustc-wrapper = "sccache"
# Teto termodinâmico ideal para o i9-9980HK de notebook:
# 6 núcleos trabalhando frios em clock boost sustentado (3.8GHz) compilam
# mais rápido do que 8 núcleos sufocados em throttling a 2.4GHz.
# Mantém também a pegada de RAM < 19GB RSS, impedindo paginação no Windows.
jobs = 6

[profile.dev]
incremental = false
opt-level = 1
# Desativa geração de PDB pesada em dev para reduzir I/O de disco e acelerar link em 40%
debug = 0
codegen-units = 256

# Zera overhead de compilação dos build scripts
[profile.dev.build-override]
opt-level = 0
debug = false
